version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mms
    ports:
      - "5432:5432"
    volumes:
      - mms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mms"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mms-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: mms-backend
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      NODE_ENV: production
      PORT: 5002
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/mms
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production_jwt_secret_mms_enterprise_key_change_me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: mms-worker
    command: ["node", "dist/worker/index.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/mms
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production_jwt_secret_mms_enterprise_key_change_me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mms-pgdata:
  mms-redisdata:
