packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

allowBuilds:
  better-sqlite3: true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  puppeteer: true

catalog:
  zod: "^4.4.3"
  fastify: "^5.11.3"
  drizzle-orm: "^0.45.2"
  react: "^19.2.8"
  react-dom: "^19.2.8"
  vite: "^8.2.1"
  "@tanstack/react-query": "^5.101.4"
  "@ts-rest/react-query": "3.52.1"
  react-router-dom: "^7.18.2"

minimumReleaseAgeExclude:
  - nodemailer@9.0.1
  - lucide-react@1.22.0
  - pg-connection-string@2.14.0
  - pg-protocol@1.15.0
  - pg@8.22.0
  - '@types/node@26.0.1'
  - react-hook-form@7.80.0
  - fastify@5.11.2

peerDependencyRules:
  allowAny:
    - eslint

overrides:
  esbuild: "^0.25.0"
  xlsx: "https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz"
  nanoid: "^3.3.18"
