name: 'Setup MMS Environment'
description: 'Standardized environment setup with Turbo cache, pnpm, Node 24, and offline-preferred dependency installation'

inputs:
  install:
    description: 'Whether to run pnpm install'
    required: false
    default: 'true'
  build-shared:
    description: 'Whether to compile @mms/shared'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Cache Turbo (incremental state)
      uses: actions/cache@v6
      with:
        path: |
          .turbo
          node_modules/.cache/turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-${{ runner.os }}-

    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'pnpm'

    - name: Install Dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Build shared package
      if: inputs.build-shared == 'true'
      shell: bash
      run: pnpm --filter @mms/shared build

