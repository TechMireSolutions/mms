name: 'Setup Production SSH'
description: 'Writes the deploy key and a pinned known_hosts for scripts/ci/ssh-exec.sh'

inputs:
  private-key:
    description: 'SSH private key for the production host'
    required: true
  known-hosts:
    description: 'Pinned known_hosts line(s) for the production host (SSH_KNOWN_HOSTS secret)'
    required: false
    default: ''
  host:
    description: 'Production host (only used for the trust-on-first-use fallback)'
    required: true

runs:
  using: 'composite'
  steps:
    # Pinned known_hosts is the trust anchor; keyscan at job time is
    # trust-on-first-use and only kept as a warned fallback until it is set.
    - name: Write deploy key and known_hosts
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        SERVER_IP: ${{ inputs.host }}
      run: |
        set -euo pipefail
        umask 077
        mkdir -p ~/.ssh
        printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
        if [ -n "${SSH_KNOWN_HOSTS}" ]; then
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
        else
          echo "::warning::SSH_KNOWN_HOSTS secret not set — falling back to unverified ssh-keyscan"
          ssh-keyscan -p 22 -H "${SERVER_IP}" >> ~/.ssh/known_hosts
        fi
