name: Renew TLS Certificate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run only (no cert changes, just check status)'
        type: boolean
        default: false

jobs:
  renew-cert:
    name: Renew MMS TLS certificate on production
    runs-on: ubuntu-latest

    steps:
      - name: Renew / re-issue MMS apex cert via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            MMS_DOMAIN="${{ secrets.MMS_APP_DOMAIN }}"

            echo "=== Certificate status for ${MMS_DOMAIN} ==="
            sudo certbot certificates 2>&1 | \
              awk "/Certificate Name: ${MMS_DOMAIN}/{found=1} found{print; if(/Private Key Path/)found=0}" || true

            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "=== DRY RUN — no changes ==="
              exit 0
            fi

            # Step 1: Try a targeted renewal of just the MMS cert.
            # This succeeds if the renewal conf uses apache/standalone/webroot authenticator.
            echo "=== Attempting targeted renewal for ${MMS_DOMAIN} ==="
            if sudo certbot renew --cert-name "${MMS_DOMAIN}" --force-renewal 2>&1; then
              echo "Targeted renewal succeeded."
            else
              # Step 2: The cert uses 'authenticator = manual' (DNS-01 issued interactively).
              # Manual certs cannot auto-renew non-interactively. Delete and re-issue
              # using the apache authenticator (HTTP-01) for the apex domain.
              # NOTE: This drops the *.${MMS_DOMAIN} wildcard. Tenant subdomains need a
              # DNS-plugin cert issued separately (see workflow README below).
              echo "::warning::Renewal failed — cert uses manual authenticator (DNS-01)."
              echo "Re-issuing ${MMS_DOMAIN} using Apache authenticator (HTTP-01)..."
              sudo certbot delete --cert-name "${MMS_DOMAIN}" --non-interactive || true
              sudo certbot certonly \
                --apache \
                --non-interactive \
                --agree-tos \
                --keep-until-expiring \
                -d "${MMS_DOMAIN}"
              echo "Re-issue complete."
            fi

            # Step 3: Reload Apache to load the new cert.
            echo "=== Reloading Apache ==="
            sudo systemctl reload apache2

            # Step 4: Verify the new expiry.
            echo "=== New cert expiry ==="
            echo | openssl s_client \
              -servername "${MMS_DOMAIN}" \
              -connect "${MMS_DOMAIN}:443" 2>/dev/null \
              | openssl x509 -noout -dates 2>/dev/null | grep notAfter || echo "unknown"

            # Step 5: Health check.
            echo "=== Health check ==="
            sleep 3
            curl -fsS --max-time 15 "https://${MMS_DOMAIN}/health"
            echo ""
            echo "MMS TLS certificate OK: https://${MMS_DOMAIN}"

            # Step 6: Clean up other abandoned/NXDOMAIN certs that break certbot --renew.
            # grav.aabtaab.com and grave.darulquran.pk have no DNS records — safe to delete.
            echo "=== Deleting abandoned certs (NXDOMAIN — no DNS records) ==="
            for ABANDONED in grav.aabtaab.com grave.darulquran.pk; do
              if sudo certbot certificates 2>&1 | grep -q "Certificate Name: ${ABANDONED}"; then
                echo "Deleting abandoned cert: ${ABANDONED}"
                sudo certbot delete --cert-name "${ABANDONED}" --non-interactive || true
              fi
            done

      - name: Ensure certbot timer is active for future auto-renewals
        if: inputs.dry_run == false
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            if ! systemctl is-active --quiet certbot.timer; then
              echo "Certbot timer inactive — re-enabling..."
              sudo systemctl enable --now certbot.timer
            fi
            echo "Certbot timer:"
            sudo systemctl status certbot.timer --no-pager || true
            echo "Next renewal:"
            sudo systemctl list-timers certbot.timer --no-pager || true

# ─── Wildcard cert note ───────────────────────────────────────────────────────
# The original MMS cert covered *.${MMS_APP_DOMAIN} (tenant subdomains).
# HTTP-01 (apache authenticator) CANNOT issue wildcards — only DNS-01 can.
# To restore wildcard coverage, install a DNS plugin on the server:
#
#   # Cloudflare (if DNS is on Cloudflare):
#   sudo apt-get install python3-certbot-dns-cloudflare
#   echo "dns_cloudflare_api_token = <TOKEN>" | sudo tee /etc/letsencrypt/cloudflare.ini
#   sudo chmod 600 /etc/letsencrypt/cloudflare.ini
#   sudo certbot certonly --dns-cloudflare \
#     --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#     -d "${MMS_APP_DOMAIN}" -d "*.${MMS_APP_DOMAIN}"
#
# After wildcard cert is issued, add --cert-name to this workflow's renewal step.
# ─────────────────────────────────────────────────────────────────────────────
