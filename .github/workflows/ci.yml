name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Lint Frontend
        run: pnpm lint
        working-directory: apps/frontend

      - name: Lint Backend
        run: pnpm lint
        working-directory: apps/backend

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET: 'e2e-test-jwt-secret-key-at-least-32-chars-long'
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/mms'
      NODE_ENV: 'test'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @mms/shared build

      # Step added: Runs database migrations before testing
      - name: Run DB Migrations / Push Schema
        run: pnpm --filter apps/backend run db:migrate # or Prisma/Drizzle/Knex migrate command

      - name: Run Test Suite
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET: 'e2e-test-jwt-secret-key-at-least-32-chars-long'
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/mms'
      NODE_ENV: 'test'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @mms/shared build

      # Step added: Runs database migrations before running E2E tests
      - name: Run DB Migrations / Push Schema
        run: pnpm --filter apps/backend run db:migrate

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: pnpm --filter e2e-tests exec playwright install chromium --with-deps

      - name: Run responsive shell E2E
        run: pnpm test:e2e tests/responsive-shell.spec.ts

      - name: Run authenticated responsive E2E
        run: pnpm test:e2e tests/responsive-authenticated.spec.ts

  build-dist:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck-lint, unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        env:
          VITE_APP_DOMAIN: ${{ secrets.MMS_APP_DOMAIN }}
        run: |
          if [ -z "${VITE_APP_DOMAIN}" ]; then
            echo "::warning::MMS_APP_DOMAIN secret empty — Vite build may lack production app domain"
          fi
          pnpm run build
          tar czf mms-dist.tar.gz apps/backend/dist apps/frontend/dist packages/shared/dist
          sha256sum mms-dist.tar.gz > mms-dist.tar.gz.sha256
          cat mms-dist.tar.gz.sha256

      - name: Upload mms-dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: mms-dist
          path: |
            mms-dist.tar.gz
            mms-dist.tar.gz.sha256
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
