name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_db: ${{ steps.filter.outputs.backend_db }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend_unit: ${{ steps.filter.outputs.backend_unit }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Paths Filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend_db:
              - 'apps/backend/src/db/**'
              - 'apps/backend/drizzle.config.ts'
              - 'apps/backend/src/**/repository/**'
              - 'apps/backend/src/**/ledgerPosting/**'
              - 'apps/backend/src/accounting/**'
              - 'apps/backend/vitest.db.config.ts'
              - 'packages/shared/**'
              - '.github/**'
            frontend:
              - 'apps/frontend/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            backend_unit:
              - 'apps/backend/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-mms

      - name: Run Typecheck
        run: pnpm typecheck

      # Fails on high/critical advisories. One moderate finding is a reviewed,
      # documented exception (ts-deepmerge via @ts-rest/open-api) — see the
      # `overrides` block in pnpm-workspace.yaml and the OpenAPI test in
      # apps/backend/src/__tests__/app.health.test.ts for the full rationale.
      # Keeping this at `high` means the exception never masks a serious
      # advisory, which is the failure mode of blanket-ignoring audit output.
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level=high

      # Ratchet: no new bare `.select()` wildcard projections (mms-performance ban).
      - name: DB projection safety
        run: pnpm run check:db-projections

      # Ratchet: no new write-blocking CREATE INDEX on large tables in migrations.
      # CONCURRENTLY cannot live in a migration (Drizzle runs each migration run in
      # one transaction) — use `pnpm --filter mms-backend index:concurrent`.
      - name: Migration index lock safety
        run: pnpm run check:migration-indexes

      # Scans the FULL git history: a credential that was committed and later
      # deleted is still recoverable from the repository and must be treated as
      # compromised. Image is pinned by digest (not `latest`) so the scanner
      # cannot change under us between runs. `--redact` keeps any finding out of
      # the CI log. Reviewed false positives live in .gitleaks.toml.
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --no-banner --redact --exit-code 1

      # Lints every package that has a lint script (frontend, backend,
      # @mms/shared, e2e) via turbo — shared/e2e were previously unlinted.
      - name: Lint (all packages)
        run: pnpm lint

      - name: Verify Agent & Rule Mirrors Sync
        run: |
          bash .agent/scripts/sync-all.sh
          git diff --exit-code -- .agent .cursor .claude || (echo "Agent rule/skill mirrors out of sync! Run 'bash .agent/scripts/sync-all.sh'" && exit 1)
          node scripts/verify-rules-integrity.mjs

  # Fails a pull request that introduces a dependency with a known vulnerability.
  # Complements the `pnpm audit` gate above: audit checks what is installed NOW,
  # dependency-review checks what the PR is ADDING, and can block it before merge.
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  test-frontend:
    name: Frontend Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-mms
        with:
          build-shared: 'true'

      - name: Run Frontend Test Shard & Generate Blob Report
        run: |
          mkdir -p apps/frontend/.vitest-reports
          pnpm --filter mms-frontend exec vitest run \
            --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} \
            --coverage \
            --coverage.thresholds.lines=0 \
            --coverage.thresholds.statements=0 \
            --coverage.thresholds.functions=0 \
            --coverage.thresholds.branches=0 \
            --reporter=default \
            --reporter=blob \
            --outputFile=.vitest-reports/blob-${{ matrix.shardIndex }}.json

      - name: Upload Shard Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-report-${{ matrix.shardIndex }}
          path: apps/frontend/.vitest-reports/blob-${{ matrix.shardIndex }}.json
          retention-days: 1

  test-frontend-coverage:
    name: Frontend Coverage Gate
    needs: [changes, test-frontend]
    if: ${{ (needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request') && !cancelled() && needs['test-frontend'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-mms
        with:
          build-shared: 'true'

      - name: Download All Shard Report Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-report-*
          merge-multiple: true
          path: apps/frontend/.vitest-reports

      - name: Merge Shard Reports & Enforce Coverage Gate
        run: |
          mkdir -p apps/frontend/.vitest-reports
          if [ -d "apps/frontend/.vitest-reports" ] && [ "$(ls -A apps/frontend/.vitest-reports)" ]; then
            pnpm --filter mms-frontend exec vitest run --merge-reports=.vitest-reports --coverage
          else
            echo "::error::No vitest blob reports found in apps/frontend/.vitest-reports to merge!"
            exit 1
          fi

  test-backend-unit:
    name: Backend Unit Tests
    needs: [changes]
    if: ${{ needs.changes.outputs.backend_unit == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-mms
        with:
          build-shared: 'true'

      - name: Run Shared Package Tests & Coverage
        run: pnpm --filter @mms/shared test:coverage

      - name: Run Backend Unit Tests & Coverage
        run: pnpm --filter mms-backend test:coverage

  test-backend-db:
    name: Backend DB Integration Tests
    needs: [changes]
    if: ${{ needs.changes.outputs.backend_db == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=1024m

    env:
      JWT_SECRET: 'e2e-test-jwt-secret-key-at-least-32-chars-long'
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/mms'
      NODE_ENV: 'test'
      LOG_LEVEL: 'silent'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-mms
        with:
          build-shared: 'true'

      - name: Run DB Migrations
        run: pnpm --filter mms-backend run db:migrate

      - name: Run Backend DB Integration Tests
        run: pnpm --filter mms-backend run test:db

  ci-gate:
    name: CI Gate (All Checks Passed)
    if: always()
    needs: [changes, lint-and-typecheck, dependency-review, test-frontend, test-frontend-coverage, test-backend-unit, test-backend-db, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Status of All Jobs
        run: |
          echo "==================== CI Gate Summary ===================="
          echo "Lint & Typecheck:       ${{ needs.lint-and-typecheck.result }}"
          echo "Dependency Review:      ${{ needs.dependency-review.result }}"
          echo "Frontend Tests:         ${{ needs.test-frontend.result }}"
          echo "Frontend Coverage:      ${{ needs.test-frontend-coverage.result }}"
          echo "Backend Unit Tests:     ${{ needs.test-backend-unit.result }}"
          echo "Backend DB Tests:       ${{ needs.test-backend-db.result }}"
          echo "E2E Tests:              ${{ needs.e2e.result }}"
          echo "========================================================="

          failed=0

          if [ "${{ needs.lint-and-typecheck.result }}" != "success" ]; then
            echo "::error::lint-and-typecheck failed or was cancelled (result: ${{ needs.lint-and-typecheck.result }})"
            failed=1
          fi

          # PR-only job: "skipped" on push to main is expected, not a failure.
          if [ "${{ needs.dependency-review.result }}" != "success" ] && [ "${{ needs.dependency-review.result }}" != "skipped" ]; then
            echo "::error::dependency-review failed or was cancelled (result: ${{ needs.dependency-review.result }})"
            failed=1
          fi

          if [ "${{ needs.test-frontend.result }}" != "success" ] && [ "${{ needs.test-frontend.result }}" != "skipped" ]; then
            echo "::error::test-frontend failed or was cancelled (result: ${{ needs.test-frontend.result }})"
            failed=1
          fi

          if [ "${{ needs.test-frontend-coverage.result }}" != "success" ] && [ "${{ needs.test-frontend-coverage.result }}" != "skipped" ]; then
            echo "::error::test-frontend-coverage failed or was cancelled (result: ${{ needs.test-frontend-coverage.result }})"
            failed=1
          fi

          if [ "${{ needs.test-backend-unit.result }}" != "success" ] && [ "${{ needs.test-backend-unit.result }}" != "skipped" ]; then
            echo "::error::test-backend-unit failed or was cancelled (result: ${{ needs.test-backend-unit.result }})"
            failed=1
          fi

          if [ "${{ needs.test-backend-db.result }}" != "success" ] && [ "${{ needs.test-backend-db.result }}" != "skipped" ]; then
            echo "::error::test-backend-db failed or was cancelled (result: ${{ needs.test-backend-db.result }})"
            failed=1
          fi

          if [ "${{ needs.e2e.result }}" != "success" ] && [ "${{ needs.e2e.result }}" != "skipped" ]; then
            echo "::error::e2e failed or was cancelled (result: ${{ needs.e2e.result }})"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "CI Gate failed: One or more required checks did not succeed."
            exit 1
          fi

          echo "CI Gate passed: All required checks succeeded (or were safely bypassed via hermetic path filtering)."

      - name: Publish CI Gate Step Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### 🚀 MMS CI Gate Status: Passed

          | Quality Check | Status | Execution Mode |
          |---|---|---|
          | **Lint & Typecheck** | `${{ needs.lint-and-typecheck.result }}` | Turbo Cache Concurrent |
          | **Frontend Tests** | `${{ needs.test-frontend.result }}` | 2-Way Sharded Parallel Matrix |
          | **Frontend Coverage** | `${{ needs.test-frontend-coverage.result }}` | Merged Blob Reports & Coverage Enforcement |
          | **Backend Unit Tests** | `${{ needs.test-backend-unit.result }}` | In-Memory Fast Unit + Coverage Gate |
          | **Backend DB Tests** | `${{ needs.test-backend-db.result }}` | Docker Postgres 16 (Healthchecked, tmpfs) |
          | **E2E Tests** | `${{ needs.e2e.result }}` | 2-Way Sharded Playwright Matrix |
          EOF

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=1024m

    env:
      JWT_SECRET: 'e2e-test-jwt-secret-key-at-least-32-chars-long'
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/mms'
      NODE_ENV: 'test'
      LOG_LEVEL: 'warn'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-mms

      - name: Fast Build Apps
        run: pnpm build

      - name: Run DB Migrations
        run: pnpm --filter mms-backend run db:migrate

      - name: Cache Playwright Binaries
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter e2e-tests exec playwright install chromium --with-deps

      - name: Install Playwright OS Dependencies (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter e2e-tests exec playwright install-deps chromium

      - name: Run E2E Tests with Sharding
        run: pnpm test:e2e --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Blob Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: e2e/blob-report
          retention-days: 1

  merge-reports:
    if: always()
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-mms

      - name: Download Blob Reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright Reports
        run: |
          if [ -d "all-blob-reports" ] && [ "$(ls -A all-blob-reports)" ]; then
            pnpm --filter e2e-tests run merge-reports ../all-blob-reports --reporter html
          else
            echo "No blob reports found to merge. Skipping..."
          fi

      - name: Upload HTML Report Artifact
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report
          path: e2e/playwright-report
          retention-days: 7

  build-dist:
    needs: [ci-gate]
    if: always() && needs['ci-gate'].result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-mms

      - name: Production build
        env:
          VITE_APP_DOMAIN: ${{ secrets.MMS_APP_DOMAIN }}
        run: |
          if [ -z "${VITE_APP_DOMAIN}" ]; then
            echo "::warning::MMS_APP_DOMAIN secret empty — Vite build may lack production app domain"
          fi
          pnpm run build
          # Fail the build if the frontend bundle grew past its budget.
          pnpm run check:bundle
          tar czf mms-dist.tar.gz apps/backend/dist apps/frontend/dist packages/shared/dist
          sha256sum mms-dist.tar.gz > mms-dist.tar.gz.sha256
          cat mms-dist.tar.gz.sha256

      - name: Report Build Artifact Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### 📦 Production Distribution Bundle
          - **File:** \`mms-dist.tar.gz\`
          - **Size:** $(du -h mms-dist.tar.gz | cut -f1)
          - **SHA256:** \`$(cat mms-dist.tar.gz.sha256 | cut -d' ' -f1)\`
          EOF

      - name: Upload mms-dist artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: mms-dist
          path: |
            mms-dist.tar.gz
            mms-dist.tar.gz.sha256
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
