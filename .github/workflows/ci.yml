name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Lint Frontend
        run: pnpm lint
        working-directory: apps/frontend

      - name: Lint Backend
        run: pnpm lint
        working-directory: apps/backend

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET: 'e2e-test-jwt-secret-key-at-least-32-chars-long'
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/mms'
      NODE_ENV: 'test'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @mms/shared build

      - name: Run DB Migrations
        run: pnpm --filter mms-backend run db:migrate

      - name: Run Test Suite
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET: 'e2e-test-jwt-secret-key-at-least-32-chars-long'
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/mms'
      NODE_ENV: 'test'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Fast Build Apps
        run: |
          pnpm --filter @mms/shared build
          pnpm --filter mms-backend build
          pnpm --filter mms-frontend build

      - name: Run DB Migrations
        run: pnpm --filter mms-backend run db:migrate

      - name: Cache Playwright Binaries
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter e2e-tests exec playwright install chromium --with-deps

      - name: Install Playwright OS Dependencies (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter e2e-tests exec playwright install-deps chromium

      - name: Run E2E Tests with Sharding
        run: pnpm test:e2e --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: e2e/blob-report
          retention-days: 1

  merge-reports:
    if: always()
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright Reports
        run: |
          if [ -d "all-blob-reports" ] && [ "$(ls -A all-blob-reports)" ]; then
            pnpm --filter e2e-tests run merge-reports ../all-blob-reports --reporter html
          else
            echo "No blob reports found to merge. Skipping..."
          fi

      - name: Upload HTML Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: e2e/playwright-report
          retention-days: 7

  build-dist:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck-lint, unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        env:
          VITE_APP_DOMAIN: ${{ secrets.MMS_APP_DOMAIN }}
        run: |
          if [ -z "${VITE_APP_DOMAIN}" ]; then
            echo "::warning::MMS_APP_DOMAIN secret empty — Vite build may lack production app domain"
          fi
          pnpm run build
          tar czf mms-dist.tar.gz apps/backend/dist apps/frontend/dist packages/shared/dist
          sha256sum mms-dist.tar.gz > mms-dist.tar.gz.sha256
          cat mms-dist.tar.gz.sha256

      - name: Upload mms-dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: mms-dist
          path: |
            mms-dist.tar.gz
            mms-dist.tar.gz.sha256
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
